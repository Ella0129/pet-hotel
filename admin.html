<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛孩旅館 — 管理後台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="page-wrap">
  <div class="page-header">
    <div>
      <h2>⚙️ 管理後台</h2>
      <p>管理所有預約、會員與緊急通知</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stat-grid" id="adminStats">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:.5rem;margin:1.5rem 0 1rem;border-bottom:2px solid var(--border)">
    <div class="admin-tab active" id="tabReserv" onclick="showTab('reservations')">📋 預約管理</div>
    <div class="admin-tab" id="tabMembers" onclick="showTab('members')">👥 會員列表</div>
    <div class="admin-tab" id="tabEmergency" onclick="showTab('emergency')">🚨 緊急通知</div>
  </div>

  <!-- Reservations tab -->
  <div id="tabReservations">
    <div class="filter-bar">
      <select id="adminFilterStatus" class="filter-select" onchange="loadAllReservations()">
        <option value="">全部狀態</option>
        <option value="pending">待審核</option>
        <option value="confirmed">已確認</option>
        <option value="in_progress">服務中</option>
        <option value="completed">已完成</option>
        <option value="cancelled">已取消</option>
        <option value="rejected">已拒絕</option>
      </select>
      <select id="adminFilterType" class="filter-select" onchange="loadAllReservations()">
        <option value="">全部類型</option>
        <option value="hotel">住宿</option>
        <option value="grooming">美容</option>
      </select>
    </div>
    <div id="adminReservList"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- Members tab -->
  <div id="tabMembers" style="display:none">
    <div id="memberList"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- Emergency tab -->
  <div id="tabEmergency" style="display:none">
    <div class="card">
      <div class="card-header"><h3>🚨 發送緊急通知</h3></div>
      <div class="card-body">
        <div class="alert alert-warning">⚠️ 此功能用於緊急情況，請謹慎使用。通知將即時送達指定會員。</div>
        <div class="form-group">
          <label class="form-label">選擇對象 <span class="required">*</span></label>
          <select id="emergTarget" class="form-control">
            <option value="all">📢 全體會員</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">通知標題 <span class="required">*</span></label>
          <input id="emergTitle" type="text" class="form-control" placeholder="例：緊急健康通知">
        </div>
        <div class="form-group">
          <label class="form-label">通知內容 <span class="required">*</span></label>
          <textarea id="emergMessage" class="form-control" rows="4" placeholder="請輸入詳細通知內容..."></textarea>
        </div>
        <button id="btnSendEmerg" class="btn btn-danger" onclick="sendEmergency()">🚨 立即發送緊急通知</button>
      </div>
    </div>
  </div>
</div>

<!-- Status Update Modal -->
<div class="modal-overlay" id="statusModal">
  <div class="modal">
    <div class="modal-header">
      <h3>更新預約狀態</h3>
      <button class="modal-close" onclick="closeModal('statusModal')">✕</button>
    </div>
    <div class="modal-body" id="statusModalBody"></div>
    <div class="modal-footer" id="statusModalFooter"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script>
let allMembers = {};

const STATUS_TRANSITIONS = {
  pending:     [{ value:"confirmed",   label:"✅ 確認預約", cls:"btn-success" }, { value:"rejected", label:"❌ 拒絕", cls:"btn-danger" }],
  confirmed:   [{ value:"in_progress", label:"▶️ 開始服務", cls:"btn-primary" }, { value:"cancelled", label:"取消", cls:"btn-ghost" }],
  in_progress: [{ value:"completed",   label:"✅ 完成服務", cls:"btn-success" }],
};

const STATUS_NOTIF = {
  confirmed:   (svc) => ({ title: "預約已確認！", msg: `您的 ${svc} 預約已由管理員確認。` }),
  rejected:    (svc) => ({ title: "預約未通過審核", msg: `很抱歉，您的 ${svc} 預約未通過審核，如有疑問請聯絡我們。` }),
  in_progress: (svc) => ({ title: "服務開始！", msg: `您的寵物目前正在接受 ${svc} 服務，請放心。` }),
  completed:   (svc) => ({ title: "服務完成！", msg: `您的 ${svc} 服務已圓滿完成，感謝您的信任！` }),
};

requireAdmin(async (user, userData) => {
  renderNav("admin.html");
  loadStats();
  loadAllReservations();
  loadMemberOptions();
});

async function loadStats() {
  const [total, pending, completed, members] = await Promise.all([
    db.collection("reservations").get(),
    db.collection("reservations").where("status","==","pending").get(),
    db.collection("reservations").where("status","==","completed").get(),
    db.collection("users").where("role","==","member").get()
  ]);
  document.getElementById("adminStats").innerHTML = `
    <div class="stat-card"><div class="stat-icon blue">📋</div><div><div class="stat-number">${total.size}</div><div class="stat-label">總預約數</div></div></div>
    <div class="stat-card"><div class="stat-icon orange">⏳</div><div><div class="stat-number">${pending.size}</div><div class="stat-label">待審核</div></div></div>
    <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-number">${completed.size}</div><div class="stat-label">已完成</div></div></div>
    <div class="stat-card"><div class="stat-icon red">👥</div><div><div class="stat-number">${members.size}</div><div class="stat-label">會員總數</div></div></div>
  `;
}

async function loadAllReservations() {
  showLoading("adminReservList");
  const statusF = document.getElementById("adminFilterStatus").value;
  const typeF   = document.getElementById("adminFilterType").value;

  let snap = await db.collection("reservations").orderBy("createdAt","desc").get();
  let docs = snap.docs;
  if (statusF) docs = docs.filter(d => d.data().status === statusF);
  if (typeF)   docs = docs.filter(d => d.data().serviceType === typeF);

  const div = document.getElementById("adminReservList");
  if (!docs.length) {
    div.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><h3>沒有預約記錄</h3></div>`;
    return;
  }

  // Load member names
  const uids = [...new Set(docs.map(d => d.data().userId))];
  for (const uid of uids) {
    if (!allMembers[uid]) {
      const u = await db.collection("users").doc(uid).get();
      allMembers[uid] = u.exists ? u.data().name : "未知";
    }
  }

  div.innerHTML = `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>會員</th><th>寵物</th><th>服務</th><th>類型</th><th>日期</th><th>狀態</th><th>操作</th></tr></thead>
    <tbody>${docs.map(d => {
      const r = d.data();
      const dateStr = r.serviceType === "hotel" ? `${r.startDate} ~ ${r.endDate}` : `${r.startDate} ${r.timeSlot || ""}`;
      const actions = STATUS_TRANSITIONS[r.status] || [];
      return `<tr>
        <td>${allMembers[r.userId] || "—"}</td>
        <td>${r.petName}</td>
        <td>${r.serviceName}</td>
        <td>${typeBadge(r.serviceType)}</td>
        <td style="white-space:nowrap;font-size:.85rem">${dateStr}</td>
        <td>${statusBadge(r.status)}</td>
        <td>
          ${actions.length ? `<button class="btn btn-outline btn-sm" onclick="openStatusModal('${d.id}')">更新狀態</button>` : "—"}
        </td>
      </tr>`;
    }).join("")}</tbody>
  </table></div></div>`;
}

async function openStatusModal(id) {
  const doc = await db.collection("reservations").doc(id).get();
  const r = doc.data();
  const actions = STATUS_TRANSITIONS[r.status] || [];

  document.getElementById("statusModalBody").innerHTML = `
    <div style="margin-bottom:1rem">
      <div style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem">${r.serviceName}</div>
      <div style="font-size:.9rem;color:var(--text-muted)">
        🐾 ${r.petName}　📅 ${r.startDate}　${statusBadge(r.status)}
      </div>
    </div>
    <p>選擇要更新的狀態：</p>`;

  document.getElementById("statusModalFooter").innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal('statusModal')">取消</button>
    ${actions.map(a => `<button class="btn ${a.cls}" onclick="updateStatus('${id}', '${a.value}', '${r.userId}', '${r.serviceName}')">${a.label}</button>`).join("")}
  `;
  openModal("statusModal");
}

async function updateStatus(id, newStatus, userId, serviceName) {
  await db.collection("reservations").doc(id).update({
    status: newStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  const notif = STATUS_NOTIF[newStatus];
  if (notif) {
    const n = notif(serviceName);
    await sendNotification(userId, n.title, n.msg, "reservation", id);
  }
  toast(`狀態已更新為：${STATUS_LABELS[newStatus]}`);
  closeModal("statusModal");
  loadAllReservations();
  loadStats();
}

async function loadMemberOptions() {
  const snap = await db.collection("users").where("role","==","member").get();
  const sel  = document.getElementById("emergTarget");
  snap.docs.forEach(d => {
    allMembers[d.id] = d.data().name;
    sel.innerHTML += `<option value="${d.id}">${d.data().name} (${d.data().email})</option>`;
  });
}

async function sendEmergency() {
  const target  = document.getElementById("emergTarget").value;
  const title   = document.getElementById("emergTitle").value.trim();
  const message = document.getElementById("emergMessage").value.trim();
  if (!title || !message) { toast("請填寫標題和內容", "error"); return; }

  setBtn("btnSendEmerg", true, "發送中...");
  if (target === "all") {
    const snap = await db.collection("users").where("role","==","member").get();
    const batch = db.batch();
    snap.docs.forEach(d => {
      const ref = db.collection("notifications").doc();
      batch.set(ref, { userId: d.id, title, message, type: "emergency", read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    toast(`已發送給 ${snap.size} 位會員`);
  } else {
    await sendNotification(target, title, message, "emergency");
    toast("緊急通知已發送");
  }
  document.getElementById("emergTitle").value = "";
  document.getElementById("emergMessage").value = "";
  setBtn("btnSendEmerg", false, "🚨 立即發送緊急通知");
}

function showTab(name) {
  ["reservations","members","emergency"].forEach(t => {
    document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).style.display = "none";
  });
  document.getElementById(`tab${name.charAt(0).toUpperCase() + name.slice(1)}`).style.display = "";
  document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
  document.getElementById(`tab${name.charAt(0).toUpperCase() + name.slice(1).split('')[0].toUpperCase() + name.slice(2)}`);
  if (name === "members") loadMemberList();
}

async function loadMemberList() {
  showLoading("memberList");
  const snap = await db.collection("users").orderBy("createdAt","desc").get();
  const div  = document.getElementById("memberList");
  div.innerHTML = `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>姓名</th><th>Email</th><th>手機</th><th>角色</th><th>加入時間</th></tr></thead>
    <tbody>${snap.docs.map(d => {
      const u = d.data();
      return `<tr>
        <td><strong>${u.name || "—"}</strong></td>
        <td>${u.email}</td>
        <td>${u.phone || "—"}</td>
        <td><span class="badge ${u.role === "admin" ? "badge-confirmed" : "badge-completed"}">${u.role === "admin" ? "管理員" : "會員"}</span></td>
        <td style="font-size:.85rem">${formatDate(u.createdAt)}</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div></div>`;
}
</script>
<style>
.admin-tab {
  padding:.6rem 1.25rem; font-weight:600; cursor:pointer;
  color:var(--text-muted); border-bottom:3px solid transparent;
  margin-bottom:-2px; transition:var(--transition); font-size:.9rem;
}
.admin-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.admin-tab:hover { color:var(--text); }
</style>
</body>
</html>
